[platformio]
data_dir = scripts

[env:esp32s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ── Hardware — N16R8 (16 MB flash, 8 MB OPI PSRAM) ──────────────────────────
board_build.flash_size         = 16MB
board_build.flash_mode         = dio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size        = 16MB

; ── Partition table ──────────────────────────────────────────────────────────
board_build.partitions = partitions.csv

; ── Filesystem ───────────────────────────────────────────────────────────────
; The FAT16 image is built and flashed manually via tools/:
;   python tools/build_fs.py    → builds tools/fat16.bin
;   python tools/flash_fs.py    → flashes to 0x600000
; Do NOT use 'pio run --target uploadfs' — it produces a FAT32 image that
; Windows rejects on sub-32MB volumes (cluster count below FAT32 minimum).
board_build.filesystem = fatfs

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    -D ARDUINO_USB_MODE=0           ; TinyUSB mode (required for HID + MSC)
    -D ARDUINO_USB_CDC_ON_BOOT=1    ; USB CDC serial on boot
    -D ARDUINO_USB_MSC_ON_BOOT=0    ; disable built-in firmware MSC (conflicts)
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -I include                      ; resolve local headers for IntelliSense

; ── Upload ───────────────────────────────────────────────────────────────────
upload_speed    = 921600
upload_protocol = esptool
upload_port     = COM7

; ── Monitor ──────────────────────────────────────────────────────────────────
monitor_port    = COM7
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder